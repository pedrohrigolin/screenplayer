<!doctype html>
<html lang="pt-BR">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Projeto de PICO</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="on-home">

    <header>

        <div class="l">

            <button id="back" class="action-button button-back">
                <svg class="svg-back svg-back-cenas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"/></svg>
                <p class="button-back-text">Cenas</p>
            </button>

            <div class="brand">
                <b id="pname">Projeto de PICO</b>
                <span id="sname"></span>
            </div>

        </div>

        <div class="r">

            <span id="saved"></span>

            <div class="tools">

                <button data-add="fala" class="action-button button-fala">
                    <svg xmlns="http://www.w3.org/2000/svg" class="svg-plus" viewBox="0 0 640 640"><path d="M352 128C352 110.3 337.7 96 320 96C302.3 96 288 110.3 288 128L288 288L128 288C110.3 288 96 302.3 96 320C96 337.7 110.3 352 128 352L288 352L288 512C288 529.7 302.3 544 320 544C337.7 544 352 529.7 352 512L352 352L512 352C529.7 352 544 337.7 544 320C544 302.3 529.7 288 512 288L352 288L352 128z"/></svg>
                    <p class="action-button-text">Fala</p>
                </button>

                <button data-add="escolha" class="action-button button-escolha">
                    <svg xmlns="http://www.w3.org/2000/svg" class="svg-plus" viewBox="0 0 640 640"><path d="M352 128C352 110.3 337.7 96 320 96C302.3 96 288 110.3 288 128L288 288L128 288C110.3 288 96 302.3 96 320C96 337.7 110.3 352 128 352L288 352L288 512C288 529.7 302.3 544 320 544C337.7 544 352 529.7 352 512L352 352L512 352C529.7 352 544 337.7 544 320C544 302.3 529.7 288 512 288L352 288L352 128z"/></svg>
                    <p class="action-button-text">Escolha</p>
                </button>

                <i></i>

                <button id="auto" class="action-button button-organizar">
                    <p class="action-button-text">Organizar</p>
                </button>

                <button id="exp" class="action-button button-exportar">
                    <p class="action-button-text">Exportar</p>
                </button>

            </div>

        </div>

    </header>

    <section id="home">

        <div class="hw">

            <h1>Cenas do projeto</h1>

            <label>
                Nome do projeto
                <input type="text" id="pn">
            </label>

            <div id="cards"></div>

        </div>

    </section>

    <main>

        <button id="rail-left" class="panel-rail" type="button" title="Mostrar roteiro (Ctrl+B)">
            <svg class="rail-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 96C239.2 96 174.5 132.8 127.4 176.6C80.6 220.1 49.3 272 34.4 307.7C31.1 315.6 31.1 324.4 34.4 332.3C49.3 368 80.6 420 127.4 463.4C174.5 507.1 239.2 544 320 544C400.8 544 465.5 507.2 512.6 463.4C559.4 419.9 590.7 368 605.6 332.3C608.9 324.4 608.9 315.6 605.6 307.7C590.7 272 559.4 220 512.6 176.6C465.5 132.9 400.8 96 320 96zM176 320C176 240.5 240.5 176 320 176C399.5 176 464 240.5 464 320C464 399.5 399.5 464 320 464C240.5 464 176 399.5 176 320zM320 256C320 291.3 291.3 320 256 320C244.5 320 233.7 317 224.3 311.6C223.3 322.5 224.2 333.7 227.2 344.8C240.9 396 293.6 426.4 344.8 412.7C396 399 426.4 346.3 412.7 295.1C400.5 249.4 357.2 220.3 311.6 224.3C316.9 233.6 320 244.4 320 256z"/></svg>
            <span class="rail-label">Roteiro</span>
        </button>

        <aside id="left">

            <div class="sidebar-header">

                <h3>Roteiro</h3>

                <button id="hide-left" class="icon-button" type="button" title="Ocultar roteiro (Ctrl+B)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M73 39.1C63.6 29.7 48.4 29.7 39.1 39.1C29.8 48.5 29.7 63.7 39 73.1L567 601.1C576.4 610.5 591.6 610.5 600.9 601.1C610.2 591.7 610.3 576.5 600.9 567.2L504.5 470.8C507.2 468.4 509.9 466 512.5 463.6C559.3 420.1 590.6 368.2 605.5 332.5C608.8 324.6 608.8 315.8 605.5 307.9C590.6 272.2 559.3 220.2 512.5 176.8C465.4 133.1 400.7 96.2 319.9 96.2C263.1 96.2 214.3 114.4 173.9 140.4L73 39.1zM236.5 202.7C260 185.9 288.9 176 320 176C399.5 176 464 240.5 464 320C464 351.1 454.1 379.9 437.3 403.5L402.6 368.8C415.3 347.4 419.6 321.1 412.7 295.1C399 243.9 346.3 213.5 295.1 227.2C286.5 229.5 278.4 232.9 271.1 237.2L236.4 202.5zM357.3 459.1C345.4 462.3 332.9 464 320 464C240.5 464 176 399.5 176 320C176 307.1 177.7 294.6 180.9 282.7L101.4 203.2C68.8 240 46.4 279 34.5 307.7C31.2 315.6 31.2 324.4 34.5 332.3C49.4 368 80.7 420 127.5 463.4C174.6 507.1 239.3 544 320.1 544C357.4 544 391.3 536.1 421.6 523.4L357.4 459.2z"/></svg>
                </button>

            </div>

            <textarea id="src" spellcheck="false"></textarea>

            <button id="compile" class="primary">Compilar para o grafo</button>

            <a class="tutorial-link" href="tutorial.html#roteiro" target="_blank" rel="noopener">Ver tutorial</a>

        </aside>

        <div id="resizer-left" class="panel-resizer" title="Arraste para redimensionar. Clique duas vezes para restaurar."></div>        

        <section id="canvas">

            <div id="world">

                <svg id="edges">

                    <defs>
                        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
                                markerWidth="7" markerHeight="7" orient="auto">
                            <path d="M0 0L10 5L0 10z" fill="#7b8883"/>
                        </marker>
                    </defs>

                    <g id="eg"></g>
                    <path id="tmp"/>

                </svg>

                <div id="nodes"></div>

            </div>

            <div id="legend"></div>

        </section>

        <div id="resizer-right" class="panel-resizer" title="Arraste para redimensionar. Clique duas vezes para restaurar."></div>

        <aside id="right">

            <div class="sidebar-header">

                <h3>Propriedades</h3>

                <button id="hide-right" class="icon-button" type="button" title="Ocultar propriedades (Ctrl+Alt+B)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M73 39.1C63.6 29.7 48.4 29.7 39.1 39.1C29.8 48.5 29.7 63.7 39 73.1L567 601.1C576.4 610.5 591.6 610.5 600.9 601.1C610.2 591.7 610.3 576.5 600.9 567.2L504.5 470.8C507.2 468.4 509.9 466 512.5 463.6C559.3 420.1 590.6 368.2 605.5 332.5C608.8 324.6 608.8 315.8 605.5 307.9C590.6 272.2 559.3 220.2 512.5 176.8C465.4 133.1 400.7 96.2 319.9 96.2C263.1 96.2 214.3 114.4 173.9 140.4L73 39.1zM236.5 202.7C260 185.9 288.9 176 320 176C399.5 176 464 240.5 464 320C464 351.1 454.1 379.9 437.3 403.5L402.6 368.8C415.3 347.4 419.6 321.1 412.7 295.1C399 243.9 346.3 213.5 295.1 227.2C286.5 229.5 278.4 232.9 271.1 237.2L236.4 202.5zM357.3 459.1C345.4 462.3 332.9 464 320 464C240.5 464 176 399.5 176 320C176 307.1 177.7 294.6 180.9 282.7L101.4 203.2C68.8 240 46.4 279 34.5 307.7C31.2 315.6 31.2 324.4 34.5 332.3C49.4 368 80.7 420 127.5 463.4C174.6 507.1 239.3 544 320.1 544C357.4 544 391.3 536.1 421.6 523.4L357.4 459.2z"/></svg>
                </button>

            </div>

            <div id="insp"></div>

        </aside>

        <button id="rail-right" class="panel-rail" type="button" title="Mostrar propriedades (Ctrl+Alt+B)">
            <svg class="rail-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 96C239.2 96 174.5 132.8 127.4 176.6C80.6 220.1 49.3 272 34.4 307.7C31.1 315.6 31.1 324.4 34.4 332.3C49.3 368 80.6 420 127.4 463.4C174.5 507.1 239.2 544 320 544C400.8 544 465.5 507.2 512.6 463.4C559.4 419.9 590.7 368 605.6 332.3C608.9 324.4 608.9 315.6 605.6 307.7C590.7 272 559.4 220 512.6 176.6C465.5 132.9 400.8 96 320 96zM176 320C176 240.5 240.5 176 320 176C399.5 176 464 240.5 464 320C464 399.5 399.5 464 320 464C240.5 464 176 399.5 176 320zM320 256C320 291.3 291.3 320 256 320C244.5 320 233.7 317 224.3 311.6C223.3 322.5 224.2 333.7 227.2 344.8C240.9 396 293.6 426.4 344.8 412.7C396 399 426.4 346.3 412.7 295.1C400.5 249.4 357.2 220.3 311.6 224.3C316.9 233.6 320 244.4 320 256z"/></svg>
            <span class="rail-label">Propriedades</span>
        </button>

    </main>

    <dialog id="dlg">

        <div class="dh">
            <h3>Exportar para a engine</h3>
            <button id="x">Fechar</button>
        </div>

        <div class="tabs">
            <button data-f="json">JSON</button>
            <button data-f="xml">XML</button>
            <button data-f="yaml">YAML</button>
        </div>

        <textarea id="out" readonly spellcheck="false"></textarea>

        <div class="df">
            <button id="cp">Copiar</button>
            <button id="dl" class="primary">Baixar arquivo</button>
        </div>

    </dialog>

    <input type="file" id="imp" accept=".json,.xml,.yaml,.yml" hidden>

    <script src="./sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/pedrohrigolin/Toastlet-Notify-JS@1.0.0/toastletNotify.min.js"></script>
    <script src="app.js"></script>

</body>

</html>
